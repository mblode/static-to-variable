name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      # changesets/action commits "Version Packages" to a new branch. The
      # repo's lefthook pre-commit hook runs oxlint, whose native linux binding
      # is missing from the lockfile on hosted runners (npm optional deps bug).
      # Skip hooks entirely in CI.
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.18"

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.12.1

      - run: npm ci
      - run: uv sync

      # Rung 1: the release job blocks on the same full gate used before a
      # push, so a green Changesets run cannot hide a red Python or E2E gate.
      - name: Verify the release candidate
        run: npm run verify:full

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
